<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Unificador de PDFs</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>📄 Unificador de PDFs</h1>
        <p>Combine múltiplos PDFs em uma visualização única</p>
      </div>

      <div class="main-grid">
        <!-- Sidebar -->
        <div class="sidebar">
          <div class="upload-section">
            <h2>Seus PDFs</h2>
            <div class="upload-area" id="uploadArea">
              <div class="upload-icon">📁</div>
              <p><strong>Clique ou arraste arquivos aqui</strong></p>
              <p class="small">Selecione múltiplos arquivos PDF (.pdf)</p>
              <input type="file" id="fileInput" multiple accept=".pdf" />
            </div>
            <div class="pdf-list" id="pdfList"></div>
          </div>
        </div>

        <!-- Viewer -->
        <div class="viewer">
          <div class="viewer-controls">
            <h2>Visualizador Unificado</h2>
            <div class="controls-buttons">
              <button class="btn" id="mergeBtn" disabled>
                ✨ Mesclar e Baixar
              </button>
              <button class="btn btn-secondary" id="clearBtn">
                Limpar Tudo
              </button>
              <button class="btn" id="downloadBtn" disabled>
                📥 Baixar Lista
              </button>
            </div>
          </div>

          <div class="pdf-container" id="pdfContainer">
            <div class="empty-state">
              <div class="empty-icon">📚</div>
              <h3>Nenhum PDF selecionado</h3>
              <p>Arraste PDFs para a lista ou clique para adicionar</p>
            </div>
          </div>

          <div class="navigation" id="navigation" style="display: none">
            <button class="btn-nav" id="prevBtn">← Anterior</button>
            <div class="page-info">
              <span id="pageInfo">PDF 1 de 1</span>
            </div>
            <button class="btn-nav" id="nextBtn">Próximo →</button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
